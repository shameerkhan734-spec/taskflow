name: CI/CD Pipeline — Test → Build → Deploy to AWS

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main          # Deploy on push to main
      - develop       # Run tests only
  pull_request:
    branches:
      - main          # Run tests on PRs

# ─── Environment Variables ────────────────────────────────────────────────────
env:
  AWS_REGION: ap-south-1                              # Mumbai (closest to Hyderabad)
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO_BACKEND: taskflow-backend
  ECR_REPO_FRONTEND: taskflow-frontend
  EC2_HOST: ${{ secrets.EC2_HOST }}

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Test Backend
  # ════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run linter
        working-directory: ./backend
        run: npm run lint || true     # Don't fail on lint warnings

      - name: Run tests with coverage
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Test Frontend
  # ════════════════════════════════════════════════════════════════════════════
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm test
        env:
          CI: true

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Build & Push Docker Images to AWS ECR
  # Only runs on push to main after all tests pass
  # ════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]       # Only run if both tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

      - name: Build & Push Backend image
        working-directory: ./backend
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ steps.meta.outputs.tag }}"
          LATEST="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:latest"

          docker build --target production -t $IMAGE -t $LATEST .
          docker push $IMAGE
          docker push $LATEST
          echo "✅ Backend image pushed: $IMAGE"

      - name: Build & Push Frontend image
        working-directory: ./frontend
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ steps.meta.outputs.tag }}"
          LATEST="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:latest"

          docker build --target production -t $IMAGE -t $LATEST .
          docker push $IMAGE
          docker push $LATEST
          echo "✅ Frontend image pushed: $IMAGE"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: Deploy to EC2
  # SSH into your EC2 instance and pull the new images
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production        # Requires manual approval if configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e    # Exit immediately if any command fails

            echo "━━━ 1. Navigate to app directory ━━━"
            cd /home/ubuntu/taskflow

            echo "━━━ 2. Pull latest docker-compose.yml ━━━"
            git pull origin main

            echo "━━━ 3. Login to AWS ECR ━━━"
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

            echo "━━━ 4. Pull latest images ━━━"
            docker compose pull backend frontend

            echo "━━━ 5. Rolling restart (zero downtime) ━━━"
            docker compose up -d --no-deps --scale backend=2 backend
            sleep 15
            docker compose up -d --no-deps backend frontend

            echo "━━━ 6. Health check ━━━"
            sleep 5
            curl -f http://localhost/health || (echo "Health check FAILED!" && exit 1)
            curl -f http://localhost:5000/health || (echo "Backend health check FAILED!" && exit 1)

            echo "━━━ 7. Cleanup old images ━━━"
            docker image prune -f

            echo "✅ Deployment successful!"

      - name: Notify success
        if: success()
        run: echo "🎉 Deployment to production completed successfully!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment FAILED. Check logs above."
