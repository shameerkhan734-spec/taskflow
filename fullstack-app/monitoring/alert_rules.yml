groups:
  - name: taskflow_alerts
    rules:

      # Alert if backend is down for > 1 minute
      - alert: BackendDown
        expr: up{job="taskflow-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TaskFlow backend is DOWN"
          description: "Backend has been unreachable for more than 1 minute."

      # Alert if high error rate (5xx errors > 5%)
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "More than 5% of requests are returning 5xx errors."

      # Alert if response time p95 > 2 seconds
      - alert: SlowResponses
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow API responses"
          description: "95th percentile response time exceeds 2 seconds."

      # Alert if heap memory usage > 512MB
      - alert: HighMemoryUsage
        expr: node_app_nodejs_heap_size_used_bytes > 512 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Node.js heap memory usage"
          description: "Heap usage has exceeded 512MB."
