global:
  scrape_interval: 15s        # How often to scrape targets
  evaluation_interval: 15s    # How often to evaluate rules
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []           # Add alertmanager here if needed

rule_files:
  - "alert_rules.yml"          # Load alert rules

scrape_configs:

  # ── Prometheus itself ────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Node.js Backend ──────────────────────────────────────────────────────────
  - job_name: 'taskflow-backend'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ── Node Exporter (EC2 system metrics) ───────────────────────────────────────
  # Uncomment when deployed to EC2 with node_exporter running
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['localhost:9100']
